name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the macOS system python3 the owner runs locally.
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Engine tests (includes the answer test set against its baseline)
        run: python3 engine/bin/brain test
      - name: Answer test set
        run: python3 engine/bin/brain eval
      - name: Brain contracts, append-only files, credentials
        run: python3 engine/bin/brain check --guard

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The version the 100% was measured on; older Pythons trace `continue` differently.
          python-version: "3.9"
      # coverage.py is needed here only: the engine itself stays standard-library only.
      - run: pip install "coverage>=7.10"
      - name: Engine tests under coverage (subprocesses included, see .coveragerc)
        run: coverage run -m unittest discover -s engine/tests
      - name: Every line and branch of engine/lib, engine/hooks and engine/bin is run (fails under 100%)
        run: coverage combine && coverage report
